name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        run: |
          # Install shellcheck
          apt-get update && apt-get install -y shellcheck
          
          # Run shellcheck on all shell scripts
          shellcheck bin/git-cloak lib/*.sh || exit 1
          
          echo "✅ All shell scripts pass shellcheck"
      
      - name: Check shell script formatting
        run: |
          # Check that all shell scripts are executable
          [[ -x bin/git-cloak ]] || (echo "bin/git-cloak is not executable" && exit 1)
          echo "✅ Scripts are properly formatted"
