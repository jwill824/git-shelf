name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install bats-core
      
      - name: Run tests
        run: make test
      
      - name: Report test results
        if: always()
        run: |
          echo "Test suite completed"
