name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github conventional-changelog-conventionalcommits

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Update Homebrew tap
        if: steps.release.outcome == 'success'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "No release tag found, skipping tap update"
            exit 0
          fi

          TARBALL_URL="https://github.com/jwill824/git-shelf/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jwill824/homebrew-tap.git tap-repo
          cd tap-repo

          cat > Formula/git-shelf.rb << FORMULA
class GitShelf < Formula
  desc "Personal file overlay manager for git — shelf local changes across branch switches"
  homepage "https://github.com/jwill824/git-shelf"
  url "${TARBALL_URL}"
  sha256 "${SHA256}"
  version "${VERSION}"
  license "MIT"

  depends_on "go" => :build

  def install
    system "go", "build", *std_go_args(ldflags: "-s -w"), "./cmd/git-shelf"
  end

  def caveats
    <<~EOS
      Run 'git shelf init' inside any repo to get started.
    EOS
  end

  test do
    system "#{bin}/git-shelf", "--help"
  end
end
FORMULA

          git config user.name "Release Bot"
          git config user.email "bot@jwill824.com"
          git add Formula/git-shelf.rb
          git commit -m "chore: bump git-shelf to v${VERSION}" || echo "No changes to commit"
          git push origin main
