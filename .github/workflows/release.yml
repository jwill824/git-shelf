name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/github conventional-changelog-conventionalcommits

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Update Homebrew tap
        if: steps.release.outcome == 'success'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping tap update"
            exit 0
          fi

          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "No release tag found, skipping tap update"
            exit 0
          fi

          TARBALL_URL="https://github.com/jwill824/git-shelf/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jwill824/homebrew-tap.git tap-repo
          cd tap-repo

          {
            echo 'class GitShelf < Formula'
            echo '  desc "Personal file overlay manager for git"'
            echo '  homepage "https://github.com/jwill824/git-shelf"'
            echo "  url \"${TARBALL_URL}\""
            echo "  sha256 \"${SHA256}\""
            echo "  version \"${VERSION}\""
            echo '  license "MIT"'
            echo ''
            echo '  depends_on "go" => :build'
            echo ''
            echo '  def install'
            echo '    system "go", "build", *std_go_args(ldflags: "-s -w"), "./cmd/git-shelf"'
            echo '  end'
            echo ''
            echo '  def caveats'
            echo '    <<~EOS'
            echo "      Run 'git shelf init' inside any repo to get started."
            echo '    EOS'
            echo '  end'
            echo ''
            echo '  test do'
            echo '    system "#{bin}/git-shelf", "--help"'
            echo '  end'
            echo 'end'
          } > Formula/git-shelf.rb

          git config user.name "Release Bot"
          git config user.email "bot@jwill824.com"
          git add Formula/git-shelf.rb
          git commit -m "chore: bump git-shelf to v${VERSION}" || echo "No changes to commit"
          git push origin main
